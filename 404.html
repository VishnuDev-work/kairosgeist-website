<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<title>Seite nicht gefunden — KairosGeist</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --kg: #3DC9B8;
    --ink: #111;
    --bg: #ffffff;
    --muted: #555;
    --border: #e4e4e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, serif;
    line-height: 1.6;
  }
  .wrap { max-width: clamp(760px, 85vw, 1400px); margin: 0 auto; padding: 0 40px; }
  .site-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .site-nav svg { color: var(--kg); }
  .site-nav .brand-word { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; text-decoration: none; }
  .site-nav .brand-word .a { color: var(--ink); }
  .site-nav .brand-word .b { color: var(--kg); }
  main {
    max-width: clamp(760px, 85vw, 1400px);
    margin: 0 auto;
    padding: 90px 40px;
    text-align: center;
  }
  .code { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--kg); text-transform: uppercase; margin-bottom: 14px; }
  h1 { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 30px; margin: 0 0 14px; letter-spacing: -0.01em; }
  main p { color: var(--muted); margin: 0 0 6px; }
  main .en { font-size: 14px; margin-top: 24px; }
  a.home-link { color: var(--kg); font-weight: 600; text-decoration: none; }
  a.home-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav class="site-nav wrap" aria-label="Hauptnavigation">
  <a href="/" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
    <svg width="26" height="26" viewBox="0 0 200 200">
      <path d="M 165.68 82.40 A 68 68 0 0 0 34.32 82.40" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <path d="M 34.32 117.60 A 68 68 0 0 0 165.68 117.60" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <circle cx="100" cy="32" r="10" fill="currentColor"/>
      <circle cx="100" cy="168" r="10" fill="currentColor"/>
      <circle cx="32" cy="100" r="10" fill="currentColor"/>
      <circle cx="168" cy="100" r="10" fill="currentColor"/>
      <line x1="22" y1="100" x2="178" y2="100" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <circle cx="22" cy="100" r="8" fill="currentColor"/>
      <circle cx="178" cy="100" r="8" fill="currentColor"/>
      <circle cx="100" cy="100" r="28" fill="none" stroke="currentColor" stroke-width="6"/>
      <circle cx="100" cy="100" r="16" fill="currentColor"/>
    </svg>
    <span class="brand-word notranslate" translate="no"><span class="a">Kairos</span><span class="b">Geist</span></span>
  </a>
</nav>

<main>
  <div class="code">404</div>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Der Link ist falsch, oder die Seite wurde verschoben.</p>
  <p><a class="home-link" href="/">Zurück zur Startseite</a></p>
  <p class="en">Looking for the English site? <a class="home-link" href="/en/">Go to the English homepage</a>.</p>
</main>

</body>
</html>
